[project]
name = "pg-mcp-server"
version = "0.1.0"
description = "MCP server exposing PostgreSQL as agent-callable tools"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_mcp"]

[project.scripts]
pg-mcp-server = "pg_mcp.server:main"

[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
