[project]
name = "pg-mcp-server"
version = "0.1.0"
description = "MCP server exposing PostgreSQL as agent-callable tools"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_mcp"]

[project.scripts]
pg-mcp-server = "pg_mcp.server:main"
