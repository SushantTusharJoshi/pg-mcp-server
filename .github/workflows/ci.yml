name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -v -m "not integration"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: postgres
          # Throwaway CI container, reachable only from this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookstore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_MCP_INTEGRATION: "1"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: bookstore
      PG_USER: mcp_readonly
      PG_PASSWORD: mcp_readonly
      PG_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/bookstore
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Load seed/init.sql
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d bookstore -v ON_ERROR_STOP=1 -f seed/init.sql
      - name: Load seed/sample_clinic.sql into a second database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d bookstore -v ON_ERROR_STOP=1 -c "CREATE DATABASE clinic"
          psql -h localhost -U postgres -d clinic -v ON_ERROR_STOP=1 -f seed/sample_clinic.sql
      - run: pip install -e . pytest
      - run: python -m pytest tests/integration -v -m integration
      - name: Generic mode on the clinic schema (PG-F6)
        env:
          PG_MCP_INTEGRATION: clinic
          PG_MCP_BOOKSTORE_TOOLS: "0"
          PG_DATABASE: clinic
          PG_USER: clinic_readonly
          PG_PASSWORD: clinic_readonly
          PG_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/clinic
        run: python -m pytest tests/integration -v -m integration
