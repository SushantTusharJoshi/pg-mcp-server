name: Security drift

# Nightly: rerun the CI integration suites against fresh Postgres images.
# The repository does not change between runs, so a failure here means a
# security regression from outside it (a new minor or major image, or a
# changed default privilege). Results go to one issue labelled `drift`.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print issue writes instead of making them"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Two runs never race on the same issue.
concurrency:
  group: security-drift
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      json: ${{ steps.list.outputs.json }}
    steps:
      # README supports postgres:16; latest catches the next major early.
      - id: list
        run: |
          echo 'list=postgres:16 postgres:latest' >> "$GITHUB_OUTPUT"
          echo 'json=["postgres:16","postgres:latest"]' >> "$GITHUB_OUTPUT"

  drift:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.json) }}
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: postgres
          # Throwaway CI container, reachable only from this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookstore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_MCP_INTEGRATION: "1"
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: bookstore
      PG_USER: mcp_readonly
      PG_PASSWORD: mcp_readonly
      PG_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/bookstore
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: pip install -e . pytest
      - name: Record image version and digest
        id: info
        env:
          PGPASSWORD: postgres
        run: |
          echo "version=$(psql -h localhost -U postgres -d bookstore -Atc 'SHOW server_version')" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker image inspect "$IMAGE" --format '{{join .RepoDigests ","}}')" >> "$GITHUB_OUTPUT"
      - name: Integration suites (same script as ci.yml)
        id: suites
        shell: bash
        run: scripts/run_integration.sh 2>&1 | tee integration.log
      - name: Job summary and result file
        if: always()
        env:
          OUTCOME: ${{ steps.suites.outcome }}
          VERSION: ${{ steps.info.outputs.version }}
          DIGEST: ${{ steps.info.outputs.digest }}
        run: |
          mkdir -p result
          printf 'image=%s\noutcome=%s\nversion=%s\ndigest=%s\n' \
            "$IMAGE" "$OUTCOME" "$VERSION" "$DIGEST" > result/result.env
          {
            echo "## \`$IMAGE\`: $OUTCOME"
            echo
            echo "- Server version: ${VERSION:-unknown}"
            echo "- Digest: \`${DIGEST:-unknown}\`"
            echo
            echo '```'
            grep -E '^(FAILED|ERROR) |^=+ .* in [0-9.]+s' integration.log || echo "no pytest summary (suites did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SLUG=${IMAGE//[:\/]/-}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: drift-${{ env.SLUG }}
          path: result/result.env
          retention-days: 7

  report:
    needs: [images, drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # A missing result counts as a failure in the report, so carry on.
        continue-on-error: true
        with:
          pattern: drift-*
          path: results
      - name: Open, update or clear the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          IMAGES: ${{ needs.images.outputs.list }}
        run: scripts/drift_report.sh results "$IMAGES"
